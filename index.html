<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <span class="brand">Architecture</span>
  <input id="name" class="name" spellcheck="false" placeholder="未命名">
  <button id="save">保存</button>
  <select id="list"></select>
  <button id="del" title="删除当前图">删除</button>
  <span class="grow"></span>
  <span id="historyHint" class="history-hint"></span>
  <span class="hint">左键框选 · 中键平移 · 双击方框改字 · 双击连线加文字 · R 恢复布线 · Ctrl+Z 撤回</span>
  <button id="theme" title="切换明暗">暗</button>
</header>

<div class="workspace">
  <aside class="palette">
    <div class="palette-title">工具</div>
    <button class="tool active" data-tool="select" title="选中、框选、拖动（V）">选择</button>
    <button class="tool" data-tool="box" title="在画布上拖出大小，单击则默认大小（B）">方框</button>
    <button class="tool" data-tool="group" title="在画布上拖出大小，可把其它方框包在里面（G）">容器</button>
    <div class="palette-tip">选「容器」后在画布上按住拖出范围，方框落在里面就成了它的成员，拖动容器整体移动。</div>
  </aside>

  <main id="canvas">
    <!-- 点击层：加宽的透明路径，放在节点下面，重叠处让节点优先 -->
    <svg id="wireHits" xmlns="http://www.w3.org/2000/svg">
      <g id="hitLayer"></g>
    </svg>
    <svg id="wires" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="arrowhead" d="M0,0 L10,5 L0,10 z"></path>
        </marker>
      </defs>
      <g id="wireLayer"></g>
    </svg>
    <!-- 连线上的文字：压在线上，带底色描边 -->
    <svg id="wireLabels" xmlns="http://www.w3.org/2000/svg">
      <g id="labelLayer"></g>
    </svg>
    <div id="nodes"></div>
    <div id="marquee" hidden></div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
